# 5분마다: 텔레그램에서 눌린 버튼·명령이 있으면 처리하고, 이어서 20분 동안 빠른 모드 (PC 봇이 켜져 있으면 쉼)
#
# 누가 깨우나요?
#   - cron-job.org (외부 알람): 5분마다 정확히 깨워요 (live=false → 눌린 버튼이 있을 때만 일함)
#   - GitHub 자체 예약(schedule): GitHub이 바쁘면 30분~1시간씩 밀려서 예비용으로만 둠
#   - 직접 실행([Run workflow]): 버튼이 없어도 빠른 모드로 켜둠 (검수하려고 일부러 깨운 거니까)
name: telegram buttons

on:
  schedule:
    - cron: "*/30 * * * *"   # 예비용 (주로 cron-job.org가 5분마다 깨워요)
  workflow_dispatch:
    inputs:
      live:
        description: "버튼이 없어도 20분 빠른 모드로 켜두기"
        type: boolean
        default: true

jobs:
  # 1) 눌린 버튼이 있는지만 가볍게 확인 (없으면 설치 없이 바로 끝 → 빠르고 가벼움)
  #    여기엔 줄서기(concurrency)를 안 걸어요. 걸면 5분마다 오는 확인이 아침 카드 만들기를 밀어낼 수 있어서
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read   # 다른 실행이 돌고 있는지 보려고
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - name: 눌린 버튼 확인
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && '1' || '' }}
        run: |
          # 버튼 처리나 아침 카드가 이미 돌고 있으면 그쪽이 버튼을 처리하니 텔레그램을 건드리지 않고 쉼
          # (여기서 텔레그램에 물어보면 깨어 있는 봇의 연결을 끊어서 버튼이 늦어져요)
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -s in_progress --json databaseId,workflowName \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$busy" != "0" ] && [ -z "$FORCE" ]; then echo "다른 실행이 깨어 있어서 쉼"; exit 0; fi
          resp=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0&limit=1")
          ok=$(echo "$resp" | jq -r '.ok')
          count=$(echo "$resp" | jq -r '.result | length // 0')
          echo "ok=$ok count=$count"
          # ok=false(409)면 PC 봇이나 다른 빠른 모드가 이미 깨어 있다는 뜻 → 그쪽이 처리하니 쉼
          if [ "$ok" = "true" ] && [ "$count" != "0" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$ok" = "true" ] && [ -n "$FORCE" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi

  # 2) 있을 때만 설치하고 처리
  buttons:
    needs: check
    if: needs.check.outputs.has == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 버튼 처리 + 20분 빠른 모드
    concurrency:
      group: chipmunk-state   # 아침 카드 만들기와 동시에 돌지 않게 (같은 상태를 쓰니까)
      cancel-in-progress: false
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN_REFRESHED_AT: ${{ secrets.INSTAGRAM_TOKEN_REFRESHED_AT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        id: pip
        run: |
          pip install -r requirements.txt
          echo "pw=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      # 크롬(191MB)은 한 번 받아두고 다시 씀. 매번 받다가 다운로드가 16분 멈춘 적이 있어서
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pip.outputs.pw }}
      - name: 크롬·한글 글꼴 설치
        timeout-minutes: 10
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: 버튼 처리
        run: python bot_once.py
        env:
          FORCE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && '1' || '' }}
