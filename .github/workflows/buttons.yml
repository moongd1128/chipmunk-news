# 5분마다: 텔레그램에서 눌린 버튼·명령이 있으면 처리하고, 이어서 20분 동안 빠른 모드 (PC 봇이 켜져 있으면 쉼)
#
# 누가 깨우나요?
#   - cron-job.org (외부 알람): 5분마다 정확히 깨워요 (live=false → 눌린 버튼이 있을 때만 일함)
#   - GitHub 자체 예약(schedule): GitHub이 바쁘면 30분~1시간씩 밀려서 예비용으로만 둠
#   - 직접 실행([Run workflow]): 버튼이 없어도 빠른 모드로 켜둠 (검수하려고 일부러 깨운 거니까)
name: telegram buttons

on:
  schedule:
    - cron: "*/30 * * * *"   # 예비용 (주로 cron-job.org가 5분마다 깨워요)
  workflow_dispatch:
    inputs:
      live:
        description: "버튼이 없어도 20분 빠른 모드로 켜두기"
        type: boolean
        default: true

jobs:
  # 1) 눌린 버튼이 있는지만 가볍게 확인 (없으면 설치 없이 바로 끝 → 빠르고 가벼움)
  #    여기엔 줄서기(concurrency)를 안 걸어요. 걸면 5분마다 오는 확인이 아침 카드 만들기를 밀어낼 수 있어서
  check:
    runs-on: ubuntu-24.04  # 26으로 바뀌는 중이라 고정
    timeout-minutes: 2
    permissions:
      actions: read   # 다른 실행이 돌고 있는지 보려고
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - name: 눌린 버튼 확인
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && '1' || '' }}
        run: |
          # 버튼 처리나 아침 카드가 이미 돌고 있으면 그쪽이 버튼을 처리하니 텔레그램을 건드리지 않고 쉼
          # (여기서 텔레그램에 물어보면 깨어 있는 봇의 연결을 끊어서 버튼이 늦어져요)
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -s in_progress --json databaseId,workflowName \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$busy" != "0" ] && [ -z "$FORCE" ]; then echo "다른 실행이 깨어 있어서 쉼"; exit 0; fi
          resp=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0&limit=1")
          ok=$(echo "$resp" | jq -r '.ok')
          count=$(echo "$resp" | jq -r '.result | length // 0')
          echo "ok=$ok count=$count"
          # ok=false(409)면 PC 봇이나 다른 빠른 모드가 이미 깨어 있다는 뜻 → 그쪽이 처리하니 쉼
          if [ "$ok" = "true" ] && [ "$count" != "0" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi
          if [ "$ok" = "true" ] && [ -n "$FORCE" ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi

  # 2) 있을 때만 설치하고 처리
  buttons:
    needs: check
    if: needs.check.outputs.has == '1'
    runs-on: ubuntu-24.04  # 26으로 바뀌는 중이라 고정
    timeout-minutes: 40   # 버튼 처리 + 20분 빠른 모드
    permissions:
      contents: read
      actions: write   # 링크 페이지 갱신(pages.yml)을 깨우려고
    concurrency:
      group: chipmunk-state   # 아침 카드 만들기와 동시에 돌지 않게 (같은 상태를 쓰니까)
      cancel-in-progress: false
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_TOKEN_REFRESHED_AT: ${{ secrets.INSTAGRAM_TOKEN_REFRESHED_AT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        timeout-minutes: 5
        run: |
          pip install -r requirements.txt
          # 사이트 모음 릴스에서 사이트 화면을 녹화할 때 쓰는 작은 영상 도구 (약 2MB, 크롬은 GitHub에 깔린 것 사용)
          python -m playwright install ffmpeg
      # 크롬은 따로 받지 않고 GitHub에 이미 깔린 크롬을 쓴다 (render.py)
      # → 크롬(191MB)·우분투 패키지를 받다가 10~16분씩 멈추던 일이 없어짐
      # 글꼴·이모지(인터넷에서 받는 것)는 한 번 받아두고 다시 씀
      - uses: actions/cache@v4
        with:
          path: assets/cache
          key: render-cache-${{ github.run_id }}
          restore-keys: render-cache-
      # 한글 예비 글꼴 (카드 글꼴 Pretendard가 안 받아질 때만 쓰임). 느리면 건너뛴다
      - name: 한글 예비 글꼴
        timeout-minutes: 3
        continue-on-error: true
        run: sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk > /dev/null
      - name: 크롬·화면 녹화 되는지 확인
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          b = sync_playwright().start().chromium.launch(channel="chrome")
          c = b.new_context(record_video_dir="/tmp/rec")
          c.new_page().goto("about:blank")
          c.close()
          print("크롬·녹화 OK", b.version)
          PY
      - name: 버튼 처리
        run: python bot_once.py
        env:
          FORCE_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.live && '1' || '' }}
      # [발행]이 성공했으면 프로필 링크 페이지(원문 모음)도 바로 새로 만든다
      - name: 링크 페이지 갱신 요청
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .links_changed ]; then gh workflow run pages.yml -R "$GITHUB_REPOSITORY"; echo "링크 페이지 갱신 요청함"; fi
