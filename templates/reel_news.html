<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=block">
<!--
  뉴스 움직이는 릴스 (1080x1920). reels.make_news_reel이 render(t)를 1/30초마다 불러서 한 장씩 찍는다.
  장면: 훅(표지 사진 + 제목, 사진은 가만히) → 슬라이드마다 [큰 제목 → 본문이 한 줄씩 툭툭] → 그래서 나는?
-->
<style>
  :root { --bg:#FFF7EC; --ink:#2B1D14; --muted:#8A6F5A; --accent:#F2762E; --soft:#F7E2C8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Noto Color Emoji",sans-serif; word-break:keep-all; }
  h1, h2 { text-wrap: balance; }
  .scene { position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
    padding:0 80px 140px; }
  .in { opacity:0; }
  .brand { position:absolute; top:84px; left:80px; z-index:5; background:var(--ink); color:#fff; font-size:32px;
    font-weight:700; padding:14px 26px; border-radius:999px; }
  .handle { position:absolute; bottom:70px; right:80px; z-index:5; font-size:32px; font-weight:700; color:var(--muted); }

  /* 훅: 표지 사진 위에 큰 제목 */
  #hook { padding-bottom:260px; justify-content:flex-end; color:#fff; }
  #hook .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #hook .shade { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,12,6,.25) 0%, rgba(20,12,6,.1) 30%, rgba(20,12,6,.75) 62%, rgba(20,12,6,.92) 100%); }
  #hook .logos { position:relative; display:flex; gap:20px; align-items:center; margin-bottom:40px; }
  #hook .logo { width:150px; height:150px; border-radius:40px; padding:32px; background:rgba(255,255,255,.18);
    border:2px solid rgba(255,255,255,.4); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:800; }
  #hook .logo svg { width:100%; height:100%; }
  #hook .x { width:76px; height:76px; border-radius:50%; background:var(--accent); display:flex; align-items:center;
    justify-content:center; font-size:34px; font-weight:900; }
  #hook h1 { position:relative; font-size:124px; line-height:1.14; font-weight:900; letter-spacing:-4px;
    text-shadow:0 6px 30px rgba(0,0,0,.35); }
  #hook p { position:relative; margin-top:30px; font-size:48px; font-weight:600; color:rgba(255,255,255,.9); }
  body.dark .brand { background:#fff; color:var(--ink); }
  body.dark .handle { color:rgba(255,255,255,.85); }

  /* 슬라이드: 큰 제목 + 본문 한 줄씩 */
  .num { font-size:44px; font-weight:800; color:var(--accent); }
  .num small { font-size:32px; color:var(--muted); }
  .beat h2 { margin-top:18px; font-size:100px; line-height:1.16; font-weight:900; letter-spacing:-3px; }
  .lines { margin-top:70px; }
  .line { font-size:62px; line-height:1.5; font-weight:600; }
  .hl { font-weight:800; color:var(--accent); background:linear-gradient(transparent 62%, rgba(242,118,46,.2) 62%); }
  .pic { width:100%; height:520px; object-fit:cover; border-radius:40px; margin-bottom:60px;
    box-shadow:0 22px 50px rgba(43,29,20,.16); }

  /* 그래서 나는? */
  #outro .lbl { align-self:flex-start; background:var(--accent); color:#fff; font-size:38px; font-weight:800;
    padding:12px 24px; border-radius:14px; }
  #outro h2 { margin-top:34px; font-size:92px; line-height:1.2; font-weight:900; letter-spacing:-3px; }
  #outro .tip { margin-top:56px; background:#fff; border-radius:36px; padding:44px 50px; box-shadow:0 18px 40px rgba(43,29,20,.08); }
  #outro .tip b { display:block; font-size:38px; color:var(--accent); }
  #outro .tip p { margin-top:14px; font-size:58px; font-weight:800; line-height:1.35; }
  #outro .share { margin-top:44px; font-size:46px; font-weight:700; color:var(--muted); }
</style>
</head>
<body>
<span class="brand">🐿️ 칩다람 · AI 뉴스</span>
<span class="handle">@chipmunk.news.kr</span>

<div class="scene" id="hook">
  <img class="photo" id="hookPhoto">
  <div class="shade"></div>
  <div class="logos in" id="hookLogos"></div>
  <h1 id="hookTitle"></h1>
  <p class="in" id="hookSub"></p>
</div>
<div id="beats"></div>
<div class="scene" id="outro">
  <span class="lbl in">오늘의 한줄 정리</span>
  <h2 class="in" id="outroTitle"></h2>
  <div class="tip in"><b>💡 그래서 나는?</b><p id="outroTip"></p></div>
  <p class="share in" id="outroShare"></p>
</div>

<script>
const D = window.DATA;
const T = D.timing;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const hl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="hl">$1</b>').replace(/\*\*/g, "");
// 훅 제목은 단어 단위로 하나씩 튀어나오게 (첫 프레임부터 첫 단어는 보임)
const words = D.title.split(" ");
document.getElementById("hookTitle").innerHTML = words.map(w => `<span class="w">${esc(w)}</span>`).join(" ");
document.getElementById("hookSub").innerHTML = esc(D.subtitle);
if (D.cover) document.getElementById("hookPhoto").src = D.cover;
else document.getElementById("hook").style.background = "#1B1410";
document.getElementById("hookLogos").innerHTML = D.logos.map((l, i) =>
  (i ? '<span class="x">' + (D.rivalry ? "VS" : "×") + "</span>" : "") +
  `<span class="logo">${l.svg || esc(l.name)}</span>`).join("");
document.getElementById("outroTitle").innerHTML = esc(D.takeaway);
document.getElementById("outroTip").innerHTML = esc(D.tip);
document.getElementById("outroShare").innerHTML = "📩 <b>" + esc(D.share) + "</b>에게 보내주세요";
D.beats.forEach((b, i) => {
  document.getElementById("beats").insertAdjacentHTML("beforeend", `
  <div class="scene beat" id="b${i}">
    ${b.pic ? `<img class="pic in" src="${b.pic}">` : ""}
    <div class="num in">${String(i + 1).padStart(2, "0")}<small>/${String(D.beats.length).padStart(2, "0")}</small></div>
    <h2 class="in">${hl(b.heading)}</h2>
    <div class="lines">${b.lines.map(l => `<div class="line in">${hl(l)}</div>`).join("")}</div>
  </div>`);
});

const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
function show(el, k, dy = 36) {
  el.style.opacity = clamp(k * 1.5);
  el.style.transform = `translateY(${(1 - ease(k)) * dy}px)`;
}

function render(t) {
  document.querySelectorAll(".scene").forEach(s => s.style.display = "none");
  document.body.classList.toggle("dark", t < T.hook);
  if (t < T.hook) {
    const s = document.getElementById("hook"); s.style.display = "flex";
    show(s.querySelector(".logos"), 1);
    const first = Math.ceil(words.length / 2);  // 앞 절반은 첫 프레임부터 보이고, 나머지가 0.09초 간격으로 툭툭
    s.querySelectorAll(".w").forEach((w, k) => {
      const kk = k < first ? 1 : (t - (k - first + 1) * 0.09) / 0.18;
      w.style.display = "inline-block"; show(w, kk, 40);
    });
    show(s.querySelector("p"), (t - words.length * 0.09 - 0.1) / 0.3);
    return;
  }
  let start = T.hook;
  for (let i = 0; i < D.beats.length; i++) {
    if (t < start + T.beat) {
      const lt = t - start, s = document.getElementById("b" + i);
      s.style.display = "flex";
      const pic = s.querySelector(".pic");
      if (pic) show(pic, lt / 0.2, 20);
      show(s.querySelector(".num"), lt / 0.15);
      show(s.querySelector("h2"), lt / 0.22);
      s.querySelectorAll(".line").forEach((l, k) => show(l, (lt - 0.45 - k * 0.38) / 0.22));
      return;
    }
    start += T.beat;
  }
  const s = document.getElementById("outro"); s.style.display = "flex";
  s.querySelectorAll(".in").forEach((el, k) => show(el, (t - start - k * 0.15) / 0.25));
}
</script>
</body>
</html>
